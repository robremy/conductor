name: 🏷️ Symphony — Auto Label

on:
  issues:
    types: [opened, reopened]
  schedule:
    # Elke 15 minuten nieuwe issues oppikken
    - cron: "*/15 * * * *"

jobs:
  auto-label:
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Prepare Symphony labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          ensure_label() {
            name="$1"
            color="$2"
            description="$3"
            if gh label view "$name" --repo "$REPO" >/dev/null 2>&1; then
              gh label edit "$name" --color "$color" --description "$description" --repo "$REPO"
            else
              gh label create "$name" --color "$color" --description "$description" --repo "$REPO"
            fi
          }

          ensure_label "agent-ready" "22c55e" "Ready for the Symphony coding agent"
          ensure_label "in-progress" "f59e0b" "Symphony is working on this issue"
          ensure_label "in-review" "8b5cf6" "Symphony PR is under review"
          ensure_label "needs-work" "ef4444" "Symphony found blocking review feedback"
          ensure_label "symphony" "3b82f6" "Created by Symphony"
          ensure_label "symphony-approved" "22c55e" "Approved by the Symphony review agent"
          ensure_label "done" "6b7280" "Completed by Symphony"

      - name: Label new issues as agent-ready
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
            # For direct issue events: label immediately
          if [ "${{ github.event_name }}" = "issues" ]; then
            ISSUE_NUM="${{ github.event.issue.number }}"

            # Skip if the issue already has a Symphony label
            LABELS=$(gh issue view "$ISSUE_NUM" --json labels -q '.labels[].name' --repo "$REPO")
            if echo "$LABELS" | grep -qE "agent-ready|in-progress|in-review|needs-work|done|symphony"; then
              echo "Issue #$ISSUE_NUM already has a Symphony label — skip"
              exit 0
            fi

            # Skip issues without a useful description
            BODY=$(gh issue view "$ISSUE_NUM" --json body -q '.body' --repo "$REPO")
            if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
              echo "Issue #$ISSUE_NUM has no description — skip"
              exit 0
            fi

            gh issue edit "$ISSUE_NUM" --add-label "agent-ready" --repo "$REPO"
            echo "✅ Issue #$ISSUE_NUM labeled as agent-ready"

          else
            # Cron: pick up all issues without a Symphony label
            echo "🔍 Looking for unlabeled issues..."
            gh issue list \
              --state open \
              --json number,labels,body \
              --repo "$REPO" | \
            python3 -c "
import json, sys, subprocess

issues = json.load(sys.stdin)
symphony_labels = {'agent-ready','in-progress','in-review','needs-work','done','symphony','symphony-approved'}

for issue in issues:
    num = issue['number']
    labels = {l['name'] for l in issue.get('labels', [])}
    body = issue.get('body') or ''

    # Skip if it already has a Symphony label
    if labels & symphony_labels:
        continue

    # Skip if there is no description
    if not body.strip():
        continue

    subprocess.run(['gh', 'issue', 'edit', str(num), '--add-label', 'agent-ready', '--repo', '$REPO'])
    print(f'✅ Issue #{num} labeled as agent-ready')
"
          fi
