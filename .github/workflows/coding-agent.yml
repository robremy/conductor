name: 🎵 Symphony — Coding Agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue nummer"
        required: true

jobs:
  coding-agent:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'agent-ready'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installeer dependencies
        run: pip install requests --quiet

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Symphony labels klaarzetten
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          ensure_label() {
            name="$1"
            color="$2"
            description="$3"
            if gh label view "$name" --repo "$REPO" >/dev/null 2>&1; then
              gh label edit "$name" --color "$color" --description "$description" --repo "$REPO"
            else
              gh label create "$name" --color "$color" --description "$description" --repo "$REPO"
            fi
          }

          ensure_label "agent-ready" "22c55e" "Klaar voor Symphony coding agent"
          ensure_label "in-progress" "f59e0b" "Symphony werkt aan dit issue"
          ensure_label "in-review" "8b5cf6" "Symphony PR wordt beoordeeld"
          ensure_label "needs-work" "ef4444" "Symphony vond blokkerende review feedback"
          ensure_label "symphony" "3b82f6" "Aangemaakt door Symphony"
          ensure_label "symphony-approved" "22c55e" "Goedgekeurd door Symphony review agent"
          ensure_label "done" "6b7280" "Afgerond door Symphony"

      - name: Installeer npm packages
        run: |
          if [ -f package.json ]; then npm ci --silent; fi
          if [ -f frontend/package.json ]; then cd frontend && npm ci --silent; fi
          if [ -f backend/package.json ]; then cd backend && npm ci --silent; fi

      - name: Coding Agent uitvoeren
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: python coding_agent.py

      - name: Git configureren
        run: |
          git config user.name "Symphony Coding Agent 🎵"
          git config user.email "symphony@users.noreply.github.com"

      - name: Commit en push
        run: |
          git checkout -b "$BRANCH_NAME"
          git add --all
          if git diff --cached --quiet; then
            echo "Geen wijzigingen om te committen."
            echo "HAS_CHANGES=false" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -F _commit_message.txt
          git push origin "$BRANCH_NAME"
          echo "HAS_CHANGES=true" >> "$GITHUB_ENV"

      - name: PR openen
        if: env.HAS_CHANGES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --title "$(cat _pr_title.txt)" \
            --body "$(cat _pr_body.txt)" \
            --base main \
            --head "$BRANCH_NAME" \
            --label "symphony")
          PR_NUMBER=$(gh pr view "$PR_URL" --json number -q .number)
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Review workflow starten
        if: env.HAS_CHANGES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run review-agent.yml \
            -f pr_number="$PR_NUMBER" \
            -f head_ref="$BRANCH_NAME"

      - name: Issue labels updaten
        if: env.HAS_CHANGES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent-ready" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "in-progress" || true
